<div class="music-control" onclick="toggleMusic()">
    <i id="musicIcon" class="fa-solid fa-volume-xmark"></i>
</div>

<audio id="myAudio" loop>
    <source src="verdra-justward.mp3" type="audio/mpeg">
</audio>
<script>
    // ใช้ ID แทน Class เพื่อความแม่นยำ
    const audio = document.getElementById("myAudio");
    const icon = document.getElementById("musicIcon");
    const musicBtn = document.getElementById("musicBtnBox"); // เพิ่ม ID ให้กล่องปุ่ม
    function toggleMusic() {
        if (audio.paused) {
            audio.play().catch(function(error) {
                console.log("Browser blocked autoplay: ", error);
            });
            icon.className = "fa-solid fa-volume-high";
            if(musicBtn) musicBtn.classList.add("playing");
        } else {
            audio.pause();
            icon.className = "fa-solid fa-volume-xmark";
            if(musicBtn) musicBtn.classList.remove("playing");
        }
    }
</script>
